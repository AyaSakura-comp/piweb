<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover + env(safe-area-*) in CSS keeps the composer clear of
         the iPhone home indicator; user-scalable=no stops iOS zooming the page
         when the input is focused. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#1e1f22" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="piweb" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>piweb</title>
    <!-- An explicit icon stops the browser probing /favicon.ico, which would
         hit the auth gate and log a 401 on every load. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/piweb/icon-32.png" />
    <!-- Home-screen icon. iOS ignores the manifest for this and needs an opaque
         square it can apply its own corner mask to, hence a PNG per size. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/piweb/icon-180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/piweb/icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/piweb/icon-152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/piweb/icon-120.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <!-- Login gate -->
    <div id="login" class="login" hidden>
      <form class="login-card" id="login-form">
        <div class="login-logo">π</div>
        <h1>piweb</h1>
        <p class="login-sub">Enter your access token to continue.</p>
        <input
          id="login-token"
          type="password"
          inputmode="text"
          autocomplete="current-password"
          placeholder="Access token"
          aria-label="Access token"
        />
        <label class="login-remember">
          <input type="checkbox" id="login-remember" checked />
          <span>Stay signed in on this device</span>
        </label>
        <button type="submit" class="btn-primary">Unlock</button>
        <p class="login-error" id="login-error" hidden></p>
      </form>
    </div>

    <!-- App shell -->
    <div id="app" class="app" hidden>
      <div class="scrim" id="scrim" hidden></div>

      <aside class="drawer" id="drawer" aria-label="Sessions">
        <header class="drawer-head">
          <span class="drawer-title">Sessions</span>
          <div class="drawer-actions">
            <button
              class="icon-btn"
              id="btn-new-session"
              title="New session"
              aria-label="New session"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
            </button>
            <button
              class="icon-btn"
              id="btn-hide-drawer"
              title="Hide sessions"
              aria-label="Hide sessions"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="2" />
                <path d="M9 4v16M7 9l-3 3 3 3" />
              </svg>
            </button>
          </div>
        </header>
        <div class="session-list" id="session-list"></div>
        <footer class="drawer-foot">
          <button class="text-btn trash-entry" id="btn-trash">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14" />
            </svg>
            <span>Recently deleted</span>
            <span class="trash-count" id="trash-count" hidden>0</span>
          </button>
          <button class="text-btn notif-toggle" id="btn-notify">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8M13.7 21a2 2 0 01-3.4 0" />
            </svg>
            <span id="notify-label">Notifications</span>
            <span class="notif-state" id="notify-state"></span>
          </button>
          <button class="text-btn" id="btn-logout">Sign out</button>
        </footer>
      </aside>

      <main class="main">
        <header class="topbar">
          <button
            class="icon-btn"
            id="btn-menu"
            aria-label="Open sessions"
            aria-controls="drawer"
            aria-expanded="false"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
          </button>
          <div class="topbar-title">
            <span class="hash">#</span>
            <span id="session-name" role="button" tabindex="0" title="Tap to rename"
              >no session</span
            >
            <input
              id="session-name-input"
              class="name-edit"
              maxlength="80"
              hidden
              aria-label="Session name"
            />
            <span id="header-badge" class="provider-badge" hidden></span>
          </div>
          <button
            class="icon-btn danger"
            id="btn-stop"
            title="Stop"
            aria-label="Stop the current task"
            hidden
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="6" y="6" width="12" height="12" rx="2" />
            </svg>
          </button>
          <button class="icon-btn" id="btn-status" title="/pi status" aria-label="Show pi status">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 11v5M12 7.6v.9" />
            </svg>
          </button>
          <button
            class="icon-btn"
            id="btn-gpt-usage"
            title="/gpt-usage"
            aria-label="Show GPT usage"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 18a8 8 0 1116 0" />
              <path d="M12 18l4-5.5" />
              <circle cx="12" cy="18" r="1.1" />
            </svg>
          </button>
          <button class="icon-btn" id="btn-model" title="Model" aria-label="Choose model">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z" />
              <path d="M12 12l8-4.5M12 12v9M12 12L4 7.5" />
            </svg>
          </button>
          <button
            class="icon-btn"
            id="btn-thinking"
            title="Thinking level"
            aria-label="Choose thinking level"
            aria-haspopup="dialog"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8.5 15.5a6 6 0 117 0c-1 .7-1.5 1.5-1.5 2.5h-4c0-1-.5-1.8-1.5-2.5z" />
              <path d="M10 21h4M12 1V0M4.2 4.2l-1.4-1.4M19.8 4.2l1.4-1.4M2 11H0M24 11h-2" />
            </svg>
          </button>
          <button
            class="icon-btn"
            id="btn-more"
            title="More"
            aria-label="More actions"
            aria-haspopup="menu"
            aria-expanded="false"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="5" r="1.6" />
              <circle cx="12" cy="12" r="1.6" />
              <circle cx="12" cy="19" r="1.6" />
            </svg>
          </button>
        </header>

        <!-- Overflow menu. Anchored under the ⋯ button; `menu-scrim` catches the
             tap that dismisses it without swallowing the button's own click. -->
        <div class="menu-scrim" id="menu-scrim" hidden></div>
        <div class="menu-pop" id="more-menu" role="menu" aria-labelledby="btn-more" hidden>
          <button type="button" class="menu-item" id="mi-search" role="menuitem">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="M20 20l-3.5-3.5" />
            </svg>
            <span class="mi-label">Search</span>
          </button>
          <button type="button" class="menu-item" id="mi-new-chat" role="menuitem">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 20h9M4 20l1-4 9.5-9.5a2.1 2.1 0 013 3L8 19z" />
            </svg>
            <span class="mi-label">New pi session</span>
            <span class="mi-cmd">/pi new</span>
          </button>
          <button type="button" class="menu-item" id="mi-media" role="menuitem">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="18" height="14" rx="2" />
              <path d="M3 14l4.5-4.5 3.5 3.5 3-3L21 15" />
              <circle cx="8.5" cy="8.5" r="1.4" />
            </svg>
            <span class="mi-label">Media</span>
          </button>
          <button type="button" class="menu-item danger" id="mi-clean" role="menuitem">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14" />
            </svg>
            <span class="mi-label">Clean session</span>
          </button>
        </div>

        <div class="search-panel" id="search-panel" hidden>
          <div class="search-bar">
            <input
              id="search-input"
              type="search"
              inputmode="search"
              placeholder="Search this session…"
              aria-label="Search this session"
            />
            <button type="button" class="icon-btn" id="btn-search-close" aria-label="Close search">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
            </button>
          </div>
          <div class="search-results" id="search-results"></div>
        </div>

        <div class="deleted-banner" id="deleted-banner" hidden>
          <span>This session is in the trash — read only.</span>
          <button type="button" id="btn-restore-inline">Restore</button>
        </div>

        <div class="messages" id="messages"></div>

        <div class="selection-actions" id="selection-actions" role="toolbar" hidden>
          <button type="button" id="selection-quote">引用</button>
          <button type="button" id="selection-copy">複製</button>
        </div>

        <div class="custom-selection-overlay" id="custom-selection-overlay" hidden>
          <div class="sel-backdrop" id="sel-backdrop" aria-hidden="true"></div>
          <div class="sel-highlight-boxes" id="sel-highlight-boxes" aria-hidden="true"></div>
          <div class="sel-handle sel-handle-start" id="sel-handle-start" aria-label="選取起始游標">
            <div class="sel-handle-pin"></div>
          </div>
          <div class="sel-handle sel-handle-end" id="sel-handle-end" aria-label="選取結束游標">
            <div class="sel-handle-pin"></div>
          </div>
        </div>

        <button class="jump-live" id="jump-live">Jump to present ↓</button>

        <div class="typing" id="typing" hidden>
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="typing-label">pi is working…</span>
        </div>

        <div class="composer-wrap" id="composer-wrap">
          <div class="autocomplete" id="autocomplete" hidden></div>
          <div
            id="upload-progress"
            class="upload-progress"
            role="progressbar"
            aria-label="Uploading attachments"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            hidden
          >
            <div class="upload-progress-head">
              <span>Uploading attachments…</span>
              <span id="upload-progress-percent">0%</span>
            </div>
            <div class="upload-progress-track">
              <div class="upload-progress-bar" id="upload-progress-bar"></div>
            </div>
          </div>
          <div class="quote-preview" id="quote-preview" hidden>
            <span class="quote-preview-label">引用</span>
            <span class="quote-preview-text" id="quote-preview-text"></span>
            <button type="button" id="quote-preview-remove" aria-label="Remove quote">×</button>
          </div>
          <div class="attachments" id="attachments" hidden></div>
          <form class="composer" id="composer">
            <button type="button" class="icon-btn" id="btn-attach" aria-label="Add attachment">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
            </button>
            <input id="file-input" type="file" multiple hidden />
            <button type="button" class="icon-btn" id="btn-paste" aria-label="貼上剪貼簿內容" title="貼上">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
                <rect x="8" y="2" width="8" height="4" rx="1" ry="1" />
              </svg>
            </button>
            <textarea id="input" rows="1" placeholder="Message pi…" aria-label="Message"></textarea>
            <button type="submit" class="icon-btn send" id="btn-send" aria-label="Send">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 8 6 8z" /></svg>
            </button>
          </form>
        </div>
      </main>
    </div>

    <!-- KaTeX is vendored locally: the container serves static files only and
         must not depend on a CDN. Loaded before the app so window.katex exists
         by the time the first transcript renders. -->
    <div class="toast" id="toast" hidden>
      <span id="toast-text"></span>
      <button type="button" id="toast-action" hidden></button>
    </div>

    <div class="lightbox" id="lightbox" hidden>
      <div class="lb-bar">
        <span class="lb-count" id="lb-count"></span>
        <div class="lb-actions">
          <button class="icon-btn" id="lb-download" aria-label="Download image" title="下載圖片">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
          </button>
          <a class="lb-open" id="lb-open" target="_blank" rel="noopener noreferrer">Open original</a>
          <button class="icon-btn" id="lb-close" aria-label="Close image viewer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
      </div>
      <button class="lb-nav lb-prev" id="lb-prev" aria-label="Previous image">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <div class="lb-stage" id="lb-stage">
        <img id="lb-img" alt="" />
      </div>
      <button class="lb-nav lb-next" id="lb-next" aria-label="Next image">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
      </button>
      <div class="lb-strip" id="lb-strip"></div>
    </div>

    <div class="sheet" id="media-sheet" hidden>
      <div class="sheet-panel">
        <header class="sheet-head">
          <span class="sheet-title">Media</span>
          <button class="icon-btn" id="btn-media-close" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </header>
        <p class="sheet-note" id="media-note"></p>
        <div class="media-grid" id="media-grid"></div>
      </div>
    </div>

    <div class="sheet" id="model-sheet" hidden>
      <div class="sheet-panel">
        <header class="sheet-head">
          <span class="sheet-title">Model</span>
          <button class="icon-btn" id="btn-model-close" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </header>
        <div class="sheet-search">
          <input
            id="model-search"
            type="search"
            inputmode="search"
            placeholder="Filter models…"
            aria-label="Filter models"
            autocomplete="off"
          />
        </div>
        <p class="sheet-note" id="model-note"></p>
        <div class="model-list" id="model-list"></div>
      </div>
    </div>

    <div class="sheet" id="thinking-sheet" hidden>
      <div
        class="sheet-panel thinking-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="thinking-title"
      >
        <header class="sheet-head">
          <span class="sheet-title" id="thinking-title">Thinking level</span>
          <button class="icon-btn" id="btn-thinking-close" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </header>
        <p class="sheet-note" id="thinking-note"></p>
        <div class="thinking-list" id="thinking-list"></div>
      </div>
    </div>

    <div class="sheet" id="trash-sheet" hidden>
      <div class="sheet-panel">
        <header class="sheet-head">
          <span class="sheet-title">Recently deleted</span>
          <button class="icon-btn" id="btn-trash-close" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </header>
        <p class="sheet-note" id="trash-note"></p>
        <div class="trash-list" id="trash-list"></div>
      </div>
    </div>

    <script src="/vendor/katex/katex.min.js"></script>
    <script src="/app.js" type="module"></script>
  </body>
</html>

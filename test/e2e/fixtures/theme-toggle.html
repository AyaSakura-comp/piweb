<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e1f22" />
    <title>piweb theme fixture</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="app">
      <div class="scrim"></div>
      <aside class="drawer open" id="drawer" aria-label="Sessions">
        <header class="drawer-head">
          <span class="drawer-title">Sessions</span>
          <div class="drawer-actions">
            <button class="icon-btn" type="button" aria-label="New session">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
            </button>
            <button class="icon-btn" type="button" aria-label="Hide sessions">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="2" />
                <path d="M9 4v16M7 9l-3 3 3 3" />
              </svg>
            </button>
          </div>
        </header>
        <div class="session-list">
          <div class="session-item active">
            <span class="hash">#</span><span class="name">theme-preview</span>
          </div>
          <div class="session-item">
            <span class="hash">#</span><span class="name">Older session</span>
          </div>
        </div>
        <footer class="drawer-foot">
          <button class="text-btn trash-entry" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14" />
            </svg>
            <span>Recently deleted</span>
            <span class="trash-count">2</span>
          </button>
          <button class="text-btn notif-toggle" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8M13.7 21a2 2 0 01-3.4 0" />
            </svg>
            <span>Notifications</span><span class="notif-state">off</span>
          </button>
          <button
            class="text-btn drawer-theme-toggle"
            id="btn-theme"
            data-theme-toggle
            type="button"
          >
            <svg class="theme-icon theme-icon-light" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </svg>
            <svg class="theme-icon theme-icon-dark" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.5 14.2A8 8 0 019.8 3.5 8.5 8.5 0 1020.5 14.2z" />
            </svg>
            <span data-theme-label>Light mode</span>
          </button>
          <span class="text-btn">signed in as web user</span>
        </footer>
      </aside>

      <main class="main">
        <header class="topbar"><div class="topbar-title"># theme-preview</div></header>
        <div class="messages">
          <article class="msg msg-user">
            <div class="avatar">U</div>
            <div class="msg-body">
              <div class="msg-head"><span class="msg-author">Web user</span></div>
              <div class="msg-text">Please add a comfortable daytime appearance.</div>
            </div>
          </article>
        </div>
        <div class="composer-wrap">
          <form class="composer">
            <textarea rows="1" aria-label="Message" placeholder="Message pi…"></textarea>
            <button type="button" class="icon-btn send" aria-label="Send">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 8 6 8z" /></svg>
            </button>
          </form>
        </div>
      </main>
    </div>

    <script type="module">
      import { bindThemeToggle } from '/theme.js';
      bindThemeToggle(document.getElementById('btn-theme'));
    </script>
  </body>
</html>

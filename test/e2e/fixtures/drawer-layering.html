<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>piweb drawer layering fixture</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="app">
      <div class="scrim" id="scrim"></div>

      <aside class="drawer open" id="drawer" aria-label="Sessions">
        <header class="drawer-head">
          <span class="drawer-title">Sessions</span>
          <button class="icon-btn" type="button" aria-label="New session">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          </button>
        </header>
        <div class="session-list">
          <div class="session-item active">
            <span class="hash">#</span><span class="name">Current session</span>
          </div>
          <div class="session-item">
            <span class="hash">#</span><span class="name">Older session</span>
          </div>
        </div>
        <footer class="drawer-foot">
          <button class="text-btn trash-entry" id="drawer-target" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14" />
            </svg>
            <span>Recently deleted</span>
          </button>
          <button class="text-btn" id="sheet-opener" type="button">Open test sheet</button>
          <output id="click-result" aria-live="polite">Waiting</output>
        </footer>
      </aside>

      <main class="main">
        <header class="topbar"><div class="topbar-title"># Layer test</div></header>
        <div class="messages"></div>
        <button class="jump-live visible" type="button">Jump to present ↓</button>
        <div class="composer-wrap">
          <form class="composer">
            <button class="icon-btn" type="button" aria-label="Add attachment">＋</button>
            <textarea aria-label="Message" rows="1" placeholder="Message pi…"></textarea>
            <button class="icon-btn send" type="button" aria-label="Send">➤</button>
          </form>
        </div>
      </main>
    </div>

    <div class="sheet" id="fixture-sheet" hidden>
      <div class="sheet-panel">
        <header class="sheet-head">
          <span class="sheet-title">Recently deleted</span>
          <button class="icon-btn" id="sheet-close" type="button" aria-label="Close">×</button>
        </header>
        <button class="model-item" id="sheet-action" type="button">Sheet action</button>
      </div>
    </div>

    <script>
      document.getElementById('drawer-target').addEventListener('click', () => {
        document.getElementById('click-result').textContent = 'Drawer action clicked';
      });
      document.getElementById('sheet-opener').addEventListener('click', () => {
        document.getElementById('fixture-sheet').hidden = false;
      });
      document.getElementById('sheet-action').addEventListener('click', () => {
        document.getElementById('sheet-action').textContent = 'Sheet action clicked';
      });
      document.getElementById('sheet-close').addEventListener('click', () => {
        document.getElementById('fixture-sheet').hidden = true;
      });
    </script>
  </body>
</html>

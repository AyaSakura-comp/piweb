<!doctype html>
<html lang="zh-Hant" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Selection bubble frames fixture</title>
    <link rel="stylesheet" href="/app.css" />
    <style>
      body { margin: 0; }
      .text-hidden .msg-text,
      .text-hidden .msg-text *,
      .text-hidden .msg-text li::marker { color: transparent !important; }
    </style>
  </head>
  <body>
    <div class="app">
      <main class="main">
        <div class="messages" id="messages">
          <article class="msg">
            <div class="msg-body">
              <div class="msg-text"><p id="p1">22 個任務中 19 個完成、2 個被擋（蝦皮未登入、Dcard 的 Cloudflare 驗證，都是正確回報）、1 個未驗證。</p><h3 id="h">還沒解決的</h3><ul><li id="li1"><strong>Google 地圖不穩</strong>：兩次實測，一次 25 秒完成，一次 39.6 秒、13 次呼叫，而且有一句引用對不上頁面，被標成未驗證。</li><li id="li2"><strong>每進一個新頁面還是要整頁讀一次</strong>：這是現在最大的一塊（43%）。momo 這種不用標準選單標籤的網站，篩選排在商品前面。</li></ul></div>
            </div>
          </article>
        </div>
        <div class="sel-highlight-boxes" id="sel-highlight-boxes" aria-hidden="true"></div>
      </main>
    </div>
    <script type="module">
      // The bubble on its own, on a clock the test sets: every spring frame
      // can be frozen and compared with the outline the spring puts there.
      import { createSelectionBubble } from '/selection-bubble.js';

      const params = new URLSearchParams(location.search);
      if (params.get('theme')) document.documentElement.dataset.theme = params.get('theme');
      let fake = 1000;
      Object.defineProperty(document, 'timeline', { configurable: true, get: () => ({ currentTime: fake }) });
      // The settle timer runs when the test says, and so does each frame of a
      // motion drawn frame by frame.
      const timers = [];
      const frames = [];
      const win = new Proxy(window, {
        get(target, key) {
          if (key === 'setTimeout') return (fn) => { timers.push(fn); return timers.length; };
          if (key === 'clearTimeout') return () => {};
          if (key === 'requestAnimationFrame') return (fn) => { frames.push(fn); return frames.length; };
          if (key === 'cancelAnimationFrame') return () => {};
          const value = Reflect.get(target, key);
          return typeof value === 'function' ? value.bind(target) : value;
        },
      });
      const container = document.getElementById('sel-highlight-boxes');
      const scroller = document.getElementById('messages');
      const bubble = createSelectionBubble(container, { window: win, scroller });
      const text = (id) => {
        const walker = document.createTreeWalker(document.getElementById(id), NodeFilter.SHOW_TEXT);
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        return nodes;
      };
      // A point: [element id, character offset across its text].
      const point = ([id, offset]) => {
        let left = offset;
        for (const node of text(id)) {
          if (left <= node.length) return [node, left];
          left -= node.length;
        }
        const nodes = text(id);
        return [nodes.at(-1), nodes.at(-1).length];
      };
      const rects = (from, to) => {
        const range = document.createRange();
        range.setStart(...point(from));
        range.setEnd(...point(to));
        const raw = [...range.getClientRects()].filter((r) => r.width > 0 && r.height > 0);
        return raw.filter((a) => !raw.some((b) => b !== a && a.top <= b.top - 1 && a.bottom >= b.bottom + 1 && a.height > b.height * 1.3));
      };
      window.bubbleFrames = {
        at(ms) { fake = ms; },
        set(from, to) { bubble.set(rects(from, to)); },
        clear() { bubble.clear(); },
        settle() { const all = timers.splice(0); all.forEach((fn) => fn()); },
        /** Freeze every piece at `ms` on the fake clock (and draw a frame there). */
        freeze(ms) {
          fake = ms;
          frames.splice(0).forEach((fn) => fn(ms));
          for (const animation of document.getAnimations()) {
            // Read while it plays: a piece the bubble restarted has a new start.
            if (animation.playState !== 'paused' || animation.__start === undefined) animation.__start = animation.startTime;
            animation.pause();
            animation.currentTime = Math.max(0, ms - animation.__start);
          }
        },
        shapeAt: (ms) => bubble.shapeAt?.(ms),
        linesAt: (ms) => bubble.linesAt?.(ms),
      };
      window.bubbleFramesReady = true;
    </script>
  </body>
</html>
